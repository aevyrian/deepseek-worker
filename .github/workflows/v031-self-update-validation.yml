name: v031-self-update-validation
on:
  push:
    branches: [v031-self-update-validation]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check index.js
      - run: node --check client.js
      - run: node --check lib/connector-config.mjs
      - run: node --check lib/protocol.mjs
      - run: node --check lib/native-session.mjs
      - run: node --check lib/pairing.mjs
      - run: node --check lib/update.mjs
      - run: npm test
